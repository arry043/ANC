name: ARRYNetworkCounter
options:
  bundleIdPrefix: in.arrry
  organizationName: ARRRY
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  base:
    PRODUCT_NAME: "ARRY Network Counter"
    PRODUCT_BUNDLE_IDENTIFIER: "in.arrry.networkcounter"
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    ARCHS: "$(ARCHS_STANDARD)"
    ONLY_ACTIVE_ARCH: false
    INFOPLIST_FILE: "ARRYNetworkCounter/Info.plist"
    GENERATE_INFOPLIST_KEY_LSUIElement: false
    ENABLE_HARDENED_RUNTIME: true
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    COMBINE_HIDPI_IMAGES: true
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG"
      DEBUG_INFORMATION_FORMAT: "dwarf"
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      DEBUG_INFORMATION_FORMAT: "dwarf-with-dsym"
targets:
  ARRYNetworkCounter:
    type: application
    platform: macOS
    sources:
      - path: ARRYNetworkCounter
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_NAME: "ARRY Network Counter"
        PRODUCT_BUNDLE_IDENTIFIER: "in.arrry.networkcounter"
        INFOPLIST_FILE: "ARRYNetworkCounter/Info.plist"
        ARCHS: "arm64 x86_64"
        ONLY_ACTIVE_ARCH: false
schemes:
  ARRYNetworkCounter:
    build:
      targets:
        ARRYNetworkCounter: all
